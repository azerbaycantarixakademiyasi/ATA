<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATA - Süni İntellekt</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght=500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>ATA-Sİ</h1>
            <p>Azərbaycan Tarixi üzrə Süni İntellekt</p>
        </header>

        <div class="chat-interface">
            <div class="response-display" id="responseDisplay">
                <div class="message bot-message">
                    <p>Salam! Mən ATA-Sİ-yəm, Azərbaycan tarixi haqqında suallarınızı cavablandırmaq üçün buradayam.</p>
                </div>
            </div>

            <div class="format-selector">
                <button class="format-button active" data-format="paragraph">Ətraflı Məqalə</button>
                <button class="format-button" data-format="qna">Faktiki Q/C</button>
            </div>

            <div class="input-area">
                <input type="text" id="questionInput" placeholder="Azərbaycan tarixi haqqında sualınızı yazın...">
                <button id="sendButton">Göndər</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
